# ==============================================================================
# NrityaVaani - Netlify Production Configuration
# Hosts the Next.js 16 (React 19 + Turbopack) Frontend at the Edge.
#
# Backend Microservice is hosted separately on Render (see render.yaml).
# Set BACKEND_URL and NEXT_PUBLIC_BACKEND_URL in Netlify Site Settings:
#   NEXT_PUBLIC_BACKEND_URL = https://nrityavaani-backend.onrender.com
#   BACKEND_URL             = https://nrityavaani-backend.onrender.com
# ==============================================================================

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

# Next.js Runtime Plugin for App Router & Server Components
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Local Development using Netlify CLI ('netlify dev')
[dev]
  framework = "#custom"
  command = "npm run dev"
  port = 3000
  targetPort = 3000
